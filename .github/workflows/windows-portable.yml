name: Windows portable ZIP

run-name: Windows portable ZIP (${{ github.ref_name }}, run ${{ github.run_number }})

on:
  push:
    branches: [feature/moni-one]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-portable-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  RUST_TOOLCHAIN: "1.97.1"
  PYTHONUTF8: "1"

jobs:
  windows:
    name: Build Windows x64 portable ZIP
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: ./.github/actions/rust-cache
        id: rust-cache
        with:
          key: release
          target: target/release
          legacy-key: windows
      - name: Prepare pinned Windows console runtime
        run: ./scripts/prepare-windows-runtime.ps1 -Destination assets/windows/conhost
      - name: Build and verify portable ZIP
        id: package
        run: |
          $version = python scripts/preview_release.py --print-package-version nebula_app/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the package version.' }
          ./scripts/package-release.ps1 -Version $version -Configuration release -Architecture x64 -PackageBrand Pebrel -OutputDirectory dist -TargetDirectory target
          "version=$version" >> $env:GITHUB_OUTPUT
          "Commit: $env:GITHUB_SHA" >> $env:GITHUB_STEP_SUMMARY
          "ZIP: Pebrel-v$version-windows-x64.zip" >> $env:GITHUB_STEP_SUMMARY
      - name: Save compiled workload
        if: ${{ always() && steps.rust-cache.outcome == 'success' && steps.rust-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: target/release
          key: ${{ steps.rust-cache.outputs.cache-key }}
      - name: Upload Windows portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Pebrel-windows-x64-${{ github.sha }}
          path: dist/Pebrel-v${{ steps.package.outputs.version }}-windows-x64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
